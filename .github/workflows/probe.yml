name: probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which parts of the PR query does GitHub refuse for omacom/linux-aurora?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try() {
            label="$1"; fields="$2"
            q='query { repository(owner: "omacom", name: "linux-aurora") { pullRequests(states: OPEN, first: 10) { nodes { number '"$fields"' } } } }'
            if out=$(gh api graphql -f query="$q" 2>&1); then echo "OK   $label"; else echo "FAIL $label: $(echo "$out" | tr '\n' ' ' | cut -c1-110)"; fi
          }
          try "number only" ""
          try "title url isDraft updatedAt baseRefName author" "title url isDraft updatedAt baseRefName author { login }"
          try "labels" "labels(first: 10) { nodes { name } }"
          try "mergeable" "mergeable"
          try "mergeStateStatus" "mergeStateStatus"
          try "reviewDecision" "reviewDecision"
          try "reviews" "reviews(last: 20) { nodes { state author { login } } }"
          try "rollup state" "commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }"
          try "rollup contexts 5" "commits(last: 1) { nodes { commit { statusCheckRollup { state contexts(first: 5) { nodes { __typename ... on CheckRun { name conclusion status } ... on StatusContext { context state } } } } } } }"
          try "rollup contexts 30" "commits(last: 1) { nodes { commit { statusCheckRollup { state contexts(first: 30) { nodes { __typename ... on CheckRun { name conclusion status } ... on StatusContext { context state } } } } } } }"
          try "all but rollup" "title url isDraft updatedAt baseRefName author { login } labels(first: 10) { nodes { name } } mergeable mergeStateStatus reviewDecision reviews(last: 20) { nodes { state author { login } } }"
          tryo() {
            label="$1"; fields="$2"
            q='query { repository(owner: "omacom", name: "linux-aurora") { pullRequests(states: OPEN, first: 10, orderBy: {field: CREATED_AT, direction: ASC}) { nodes { number '"$fields"' } } } }'
            if out=$(gh api graphql -f query="$q" 2>&1); then echo "OK   $label"; else echo "FAIL $label: $(echo "$out" | tr '\n' ' ' | cut -c1-110)"; fi
          }
          tryo "orderBy, number only" ""
          tryo "orderBy, the real fields" "title url isDraft updatedAt baseRefName author { login } labels(first: 10) { nodes { name } } mergeable mergeStateStatus reviewDecision reviews(last: 20) { nodes { state author { login } } } commits(last: 1) { nodes { commit { statusCheckRollup { state contexts(first: 30) { nodes { __typename ... on CheckRun { name conclusion status } ... on StatusContext { context state } } } } } } }"

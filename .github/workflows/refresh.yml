name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["board.py", ".github/workflows/refresh.yml"]
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Build the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 board.py --out docs --url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
      - name: Commit the page when it changed
        run: |
          git config user.name "pr-board"
          git config user.email "pr-board@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh the board"
          git push

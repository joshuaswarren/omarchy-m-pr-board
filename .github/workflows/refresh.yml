name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [pr-board-refresh]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "board.py"
      - "maclab.json"
      - "maclab_export.py"
      - "team.json"
      - "tests/**"
      - "docs/board.json"
      - "docs/index.html"
      - "docs/summary.txt"
      - "docs/daily.txt"
      - ".github/workflows/refresh.yml"
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    # Last 30 runs finished in 1.5-5 min; 15 is 3x margin and still bounds a
    # stuck board.py (hourly cron would otherwise serialize behind it).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Build the page and commit it when it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "pr-board"
          git config user.email "pr-board@users.noreply.github.com"
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          for _ in 1 2 3; do
            python3 board.py --out docs --url "$url" --only-if-changed --keep-last-good
            git add docs
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh the board"
            if git push; then exit 0; fi
            # someone pushed meanwhile: start again from their tip
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
